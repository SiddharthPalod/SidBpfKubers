apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: sidkubers-system
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.sidkubers-system.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 5s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: sidkubers-system
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'sidkubers-dashboards'
        orgId: 1
        folder: 'SidKubers Platform'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sidkubers
  namespace: sidkubers-system
data:
  sidkubers-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Kernel-Level Protocol Events (eBPF)",
          "type": "row"
        },
        {
          "id": 1,
          "title": "PostgreSQL Connections",
          "type": "stat",
          "gridPos": { "h": 5, "w": 5, "x": 0, "y": 1 },
          "targets": [
            {
              "expr": "sum(ebpf_service_connections_total{service=\"postgresql\"}) or ebpf_postgres_connections_total or vector(0)",
              "legendFormat": "PostgreSQL",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "#3274D9" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "graphMode": "area"
          }
        },
        {
          "id": 2,
          "title": "Redis Connections",
          "type": "stat",
          "gridPos": { "h": 5, "w": 5, "x": 5, "y": 1 },
          "targets": [
            {
              "expr": "sum(ebpf_service_connections_total{service=\"redis\"}) or ebpf_redis_connections_total or vector(0)",
              "legendFormat": "Redis",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "#E02F44" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "graphMode": "area"
          }
        },
        {
          "id": 10,
          "title": "MongoDB (NoSQL) Connections",
          "type": "stat",
          "gridPos": { "h": 5, "w": 5, "x": 10, "y": 1 },
          "targets": [
            {
              "expr": "sum(ebpf_service_connections_total{service=\"mongodb\"}) or ebpf_mongodb_connections_total or vector(0)",
              "legendFormat": "MongoDB",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "#10B981" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "graphMode": "area"
          }
        },
        {
          "id": 3,
          "title": "HTTP / Nginx Connections",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 15, "y": 1 },
          "targets": [
            {
              "expr": "sum(ebpf_service_connections_total{service=~\"http.*\"}) or ebpf_nginx_connections_total or vector(0)",
              "legendFormat": "HTTP",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "#FADE2A" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "yellow", "value": null }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "graphMode": "area"
          }
        },
        {
          "id": 4,
          "title": "TCP Retransmissions / Drops",
          "type": "stat",
          "gridPos": { "h": 5, "w": 5, "x": 19, "y": 1 },
          "targets": [
            {
              "expr": "ebpf_tcp_retransmissions_total",
              "legendFormat": "Retransmissions",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "graphMode": "area"
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 101,
          "title": "Real-Time Traffic & Degradation (Kernel Traces)",
          "type": "row"
        },
        {
          "id": 5,
          "title": "TCP Connection Rate (req/sec by Service)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 7 },
          "targets": [
            {
              "expr": "sum by (service) (rate(ebpf_service_connections_total[30s]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 15,
                "lineWidth": 2
              },
              "unit": "reqps"
            }
          }
        },
        {
          "id": 6,
          "title": "Traffic Distribution by Service",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 7 },
          "targets": [
            {
              "expr": "ebpf_service_connections_total",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "orientation": "horizontal",
            "displayMode": "gradient"
          }
        },
        {
          "id": 7,
          "title": "Packet Retransmission Rate (Kernel tcp_retransmit_skb)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 15 },
          "targets": [
            {
              "expr": "rate(ebpf_tcp_retransmissions_total[30s])",
              "legendFormat": "Retransmit Rate",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "#E02F44" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineWidth": 2
              },
              "unit": "pps"
            }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["sidkubers", "ebpf", "database"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m"]
      },
      "title": "SidKubers Platform — eBPF & Database Observability",
      "uid": "sidkubers-platform"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sidkubers-system
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.4.1
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "true"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-providers
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-providers
        configMap:
          name: grafana-dashboards-provider
      - name: dashboards
        configMap:
          name: grafana-dashboard-sidkubers
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sidkubers-system
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
    name: http
